id = "wazum.grazr"
name = "grazr"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Automatically switches Claude Code to another of your accounts before the usage limit hits: account rotation for multiple subscriptions, with no prompt and no lost turn"
platforms = ["macos", "linux"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "grazr.py", "tag"]

[[actions]]
id = "swap"
title = "grazr: swap to the next account now"
description = "Move to the first account in ACCOUNTS with headroom, without waiting for the threshold"
contexts = ["global", "workspace"]
command = ["python3", "grazr.py", "swap"]

[[actions]]
id = "install"
title = "grazr: connect to Claude's status line"
description = "Put grazr into Claude's status line, keeping the one you have, so it sees every message's usage"
contexts = ["global", "workspace"]
command = ["python3", "grazr.py", "install"]

[[actions]]
id = "uninstall"
title = "grazr: disconnect from Claude's status line"
description = "Put the status line back the way it was; grazr then sees no usage"
contexts = ["global", "workspace"]
command = ["python3", "grazr.py", "uninstall"]

[[actions]]
id = "tag"
title = "grazr: tag every pane with the active account"
description = "Publish the $grazr token to every Claude pane, for after you add the sidebar row"
contexts = ["global", "workspace"]
command = ["python3", "grazr.py", "tag"]

[[panes]]
id = "enrol"
title = "grazr: enrol a Claude account"
description = "Save the current login, or log in to another account without touching it"
placement = "popup"
command = ["python3", "grazr.py", "enrol"]

[[panes]]
id = "status"
title = "grazr: accounts and headroom"
description = "Active account, what each enrolled account has left, and the config path"
placement = "popup"
command = ["python3", "grazr.py", "status"]
