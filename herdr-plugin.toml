id = "wazum.grazr"
name = "grazr"
version = "0.1.1"
min_herdr_version = "0.8.0"
description = "Automatically switches Claude Code to another of your accounts before the usage limit hits: account rotation for multiple subscriptions, with no prompt and no lost turn"
platforms = ["macos", "linux"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "grazr.py", "hook"]

[[panes]]
id = "enrol"
title = "grazr: enrol a Claude account"
description = "Save the current login, or log in to another account without touching it"
placement = "popup"
command = ["python3", "grazr.py", "enrol"]

[[panes]]
id = "status"
title = "grazr: accounts and headroom"
description = "Active account, what each enrolled account has left, and the config path"
placement = "popup"
command = ["python3", "grazr.py", "status"]
