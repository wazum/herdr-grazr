<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How grazr rotates an account</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 880px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · grazr</p>
    <h1>How grazr rotates an account</h1>

    <svg viewBox="0 0 880 964" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="grazr-flow-title grazr-flow-desc">
      <title id="grazr-flow-title">How grazr rotates an account</title>
      <desc id="grazr-flow-desc">Flowchart of grazr's response to each Claude message: it shows your status line unchanged, drops a reading that still belongs to an account it has left, records the rest, stays put while the account has room, and otherwise swaps the stored credential to a fresh account in a detached process, which Claude picks up on its next request.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows before nodes, so node fills cover the strokes. -->
      <!-- Every gap is 48px. A diamond vertex is a point, so unequal gaps make
           one arrow read as a stub. -->
      <line x1="240" y1="112" x2="240" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="240" y1="224" x2="240" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="240" y1="376" x2="240" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="240" y1="488" x2="240" y2="528" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="240" y1="640" x2="240" y2="680" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="240" y1="752" x2="240" y2="792" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- both NO branches rejoin at one merge point and run to Stay -->
      <path d="M 304,324 H 428 Q 436,324 436,332 V 448" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <path d="M 304,588 H 428 Q 436,588 436,580 V 464" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="440" y1="456" x2="520" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="248" y="388" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="272" y="400" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.06em">YES</text>

      <rect x="248" y="652" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="272" y="664" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.06em">YES</text>

      <rect x="344" y="300" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="364" y="312" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.06em">NO</text>

      <rect x="344" y="564" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="364" y="576" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.06em">NO</text>

      <circle cx="436" cy="456" r="4" fill="#2d3142"/>

      <!-- start: Claude hands its status line the payload -->
      <rect x="128" y="48" width="224" height="64" rx="20" fill="#f5f5f5"/>
      <rect x="128" y="48" width="224" height="64" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="240" y="76" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Claude sends a message</text>
      <text x="240" y="96" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">STATUS-LINE PAYLOAD</text>

      <!-- step: the bar the user set up is shown as it was -->
      <rect x="128" y="160" width="224" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="128" y="160" width="224" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="188" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Show your status line</text>
      <text x="240" y="208" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">PASSED THROUGH AS IS</text>

      <!-- decision: a session that has not asked again still reports the old account -->
      <path d="M 240,272 L 304,324 L 240,376 L 176,324 Z" fill="#f5f5f5"/>
      <path d="M 240,272 L 304,324 L 240,376 L 176,324 Z" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="320" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">This login?</text>
      <text x="240" y="340" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">RESET TIME</text>

      <!-- step: keep the reading -->
      <rect x="128" y="424" width="224" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="128" y="424" width="224" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="452" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Record the reading</text>
      <text x="240" y="472" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">ACCOUNT FILE</text>

      <!-- decision: is the window nearly gone -->
      <path d="M 240,536 L 304,588 L 240,640 L 176,588 Z" fill="#f5f5f5"/>
      <path d="M 240,536 L 304,588 L 240,640 L 176,588 Z" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="584" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Spent?</text>
      <text x="240" y="604" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">&lt;30% LEFT</text>

      <!-- the one focal node: the only step that writes anything -->
      <rect x="128" y="688" width="224" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="128" y="688" width="224" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="240" y="716" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Swap the credential</text>
      <text x="240" y="736" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">DETACHED · KEYCHAIN + ID</text>

      <rect x="128" y="800" width="224" height="64" rx="20" fill="#f5f5f5"/>
      <rect x="128" y="800" width="224" height="64" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="240" y="828" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Claude follows</text>
      <text x="240" y="848" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">NEXT REQUEST</text>

      <rect x="528" y="424" width="224" height="64" rx="20" fill="#f5f5f5"/>
      <rect x="528" y="424" width="224" height="64" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="640" y="452" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stay</text>
      <text x="640" y="472" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">NOTHING TO DO</text>

      <text x="840" y="96" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">the grass here is still fine</text>
      <path d="M 704,108 Q 700,300 664,424" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="664" cy="424" r="2" fill="#2d3142"/>

      <text x="840" y="796" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">the herd never looks up</text>
      <path d="M 700,804 Q 540,828 360,832" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="356" cy="832" r="2" fill="#2d3142"/>

      <!-- Glyphs and text share the 936 centre line, hence dominant-baseline. -->
      <line x1="40" y1="912" x2="840" y2="912" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="936" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" dominant-baseline="middle" letter-spacing="0.14em">LEGEND</text>

      <rect x="120" y="928" width="20" height="16" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="148" y="936" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" dominant-baseline="middle" letter-spacing="0.10em">START / END</text>

      <rect x="232" y="928" width="20" height="16" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
      <text x="260" y="936" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" dominant-baseline="middle" letter-spacing="0.10em">STEP</text>

      <path d="M 320,928 L 332,936 L 320,944 L 308,936 Z" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
      <text x="340" y="936" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" dominant-baseline="middle" letter-spacing="0.10em">DECISION</text>

      <rect x="412" y="928" width="20" height="16" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="440" y="936" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" dominant-baseline="middle" letter-spacing="0.10em">THE ONLY WRITE</text>
    </svg>
  </div>
</body>
</html>
