<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 852" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="grazr-flow-title grazr-flow-desc">
      <title id="grazr-flow-title">How grazr rotates an account</title>
      <desc id="grazr-flow-desc">Flowchart of grazr's response when a Claude pane finishes a turn: it reads Claude's cached usage, stays put unless that usage is both trustworthy and nearly spent, and otherwise swaps the stored keychain credential to a fresh account, which Claude picks up within its thirty-second cache.</desc>
      <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows before nodes, so node fills cover the strokes. -->
      <!-- Every gap is 48px. A diamond vertex is a point, so unequal gaps make
           one arrow read as a stub. -->
      <line x1="240" y1="112" x2="240" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="240" y1="224" x2="240" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="240" y1="376" x2="240" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="240" y1="528" x2="240" y2="568" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="240" y1="640" x2="240" y2="680" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M 304,324 H 428 Q 436,324 436,332 V 392" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <path d="M 304,476 H 428 Q 436,476 436,468 V 408" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="440" y1="400" x2="520" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="248" y="388" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="272" y="400" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.06em">YES</text>

      <rect x="248" y="540" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="272" y="552" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.06em">YES</text>

      <rect x="344" y="300" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="364" y="312" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.06em">NO</text>

      <rect x="344" y="452" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="364" y="464" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.06em">NO</text>

      <!-- merge point: both NO branches rejoin here -->
      <circle cx="436" cy="400" r="4" fill="#2d3142"/>

      <rect x="128" y="48" width="224" height="64" rx="20" fill="#f5f5f5"/>
      <rect x="128" y="48" width="224" height="64" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="240" y="76" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Turn ends</text>
      <text x="240" y="96" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">HERDR EVENT</text>

      <rect x="128" y="160" width="224" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="128" y="160" width="224" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="188" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Read usage</text>
      <text x="240" y="208" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">~/.CLAUDE.JSON</text>

      <path d="M 240,272 L 304,324 L 240,376 L 176,324 Z" fill="#f5f5f5"/>
      <path d="M 240,272 L 304,324 L 240,376 L 176,324 Z" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="320" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fresh?</text>
      <text x="240" y="340" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">&lt;1H, MATCH</text>

      <path d="M 240,424 L 304,476 L 240,528 L 176,476 Z" fill="#f5f5f5"/>
      <path d="M 240,424 L 304,476 L 240,528 L 176,476 Z" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="472" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Spent?</text>
      <text x="240" y="492" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">&lt;30% LEFT</text>

      <!-- the one focal node: the only step that writes anything -->
      <rect x="128" y="576" width="224" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="128" y="576" width="224" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="240" y="604" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Swap the credential</text>
      <text x="240" y="624" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">KEYCHAIN + IDENTITY</text>

      <rect x="128" y="688" width="224" height="64" rx="20" fill="#f5f5f5"/>
      <rect x="128" y="688" width="224" height="64" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="240" y="716" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Claude follows</text>
      <text x="240" y="736" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">≤30S CACHE</text>

      <rect x="528" y="368" width="224" height="64" rx="20" fill="#f5f5f5"/>
      <rect x="528" y="368" width="224" height="64" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="640" y="396" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stay</text>
      <text x="640" y="416" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">NOTHING TO DO</text>

      <text x="840" y="96" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">the grass here is still fine</text>
      <path d="M 704,108 Q 700,272 664,368" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="664" cy="368" r="2" fill="#2d3142"/>

      <text x="840" y="684" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">the herd never looks up</text>
      <path d="M 700,692 Q 540,716 360,720" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="356" cy="720" r="2" fill="#2d3142"/>

      <!-- Glyphs and text share the 824 centre line, hence dominant-baseline. -->
      <line x1="40" y1="800" x2="840" y2="800" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="824" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" dominant-baseline="middle" letter-spacing="0.14em">LEGEND</text>

      <rect x="120" y="816" width="20" height="16" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="148" y="824" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" dominant-baseline="middle" letter-spacing="0.10em">START / END</text>

      <rect x="232" y="816" width="20" height="16" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
      <text x="260" y="824" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" dominant-baseline="middle" letter-spacing="0.10em">STEP</text>

      <path d="M 320,816 L 332,824 L 320,832 L 308,824 Z" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
      <text x="340" y="824" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" dominant-baseline="middle" letter-spacing="0.10em">DECISION</text>

      <rect x="412" y="816" width="20" height="16" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="440" y="824" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" dominant-baseline="middle" letter-spacing="0.10em">THE ONLY WRITE</text>
    </svg>
