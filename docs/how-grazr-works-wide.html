<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How grazr rotates an account</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.75rem, 2.6vw + 0.75rem, 2.5rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.75rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · grazr</p>
    <h1>How grazr rotates an account</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="grazr-flow-title grazr-flow-desc">
      <title id="grazr-flow-title">How grazr rotates an account</title>
      <desc id="grazr-flow-desc">Flowchart of grazr's response when a Claude pane finishes a turn: it reads Claude's cached usage, stays put unless that usage is both trustworthy and nearly spent, and otherwise swaps the stored keychain credential to a fresh account, which Claude picks up within its thirty-second cache.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ARROWS FIRST -->

      <!-- main path, left to right -->
      <line x1="248" y1="192" x2="296" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="496" y1="192" x2="516" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="660" y1="192" x2="728" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="880" y1="192" x2="948" y2="192" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- the swap, then Claude picks it up -->
      <line x1="1076" y1="228" x2="1076" y2="408" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- both NO branches drop to a merge point -->
      <path d="M 592,248 V 312 Q 592,320 600,320 H 692" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <path d="M 808,248 V 312 Q 808,320 800,320 H 708" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <path d="M 700,324 V 444 Q 700,452 692,452 H 512" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ARROW LABELS -->
      <rect x="672" y="168" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="696" y="180" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <rect x="892" y="168" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="916" y="180" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <rect x="600" y="264" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="620" y="276" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <rect x="816" y="264" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="836" y="276" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- merge point where both NO branches rejoin -->
      <circle cx="700" cy="320" r="4" fill="#2d3142"/>

      <!-- NODES -->

      <!-- start: the Herdr event -->
      <rect x="48" y="156" width="200" height="72" rx="20" fill="#f5f5f5"/>
      <rect x="48" y="156" width="200" height="72" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="148" y="188" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Turn ends</text>
      <text x="148" y="208" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">HERDR EVENT</text>

      <!-- step: read what Claude already knows -->
      <rect x="304" y="156" width="192" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="304" y="156" width="192" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="188" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Read usage</text>
      <text x="400" y="208" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">~/.CLAUDE.JSON</text>

      <!-- decision: can the usage be trusted at all -->
      <path d="M 592,136 L 660,192 L 592,248 L 524,192 Z" fill="#f5f5f5"/>
      <path d="M 592,136 L 660,192 L 592,248 L 524,192 Z" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="592" y="188" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fresh?</text>
      <text x="592" y="208" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">&lt;1H · MATCH</text>

      <!-- decision: is the window nearly gone -->
      <path d="M 808,136 L 880,192 L 808,248 L 736,192 Z" fill="#f5f5f5"/>
      <path d="M 808,136 L 880,192 L 808,248 L 736,192 Z" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="808" y="188" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Spent?</text>
      <text x="808" y="208" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">&lt;15% LEFT</text>

      <!-- focal: the only step that changes anything -->
      <rect x="956" y="156" width="240" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="956" y="156" width="240" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="1076" y="188" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Swap the credential</text>
      <text x="1076" y="208" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">KEYCHAIN + IDENTITY</text>

      <!-- end: the common outcome -->
      <rect x="304" y="416" width="200" height="72" rx="20" fill="#f5f5f5"/>
      <rect x="304" y="416" width="200" height="72" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="404" y="448" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stay</text>
      <text x="404" y="468" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">NOTHING TO DO</text>

      <!-- end: no pane ever notices -->
      <rect x="956" y="416" width="240" height="72" rx="20" fill="#f5f5f5"/>
      <rect x="956" y="416" width="240" height="72" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="1076" y="448" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Claude follows</text>
      <text x="1076" y="468" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">≤30S CACHE</text>

      <!-- LEGEND -->
      <line x1="48" y1="660" x2="1232" y2="660" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="48" y="688" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="160" y="676" width="20" height="12" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="188" y="688" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.10em">START / END</text>

      <rect x="332" y="676" width="20" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
      <text x="360" y="688" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.10em">STEP</text>

      <path d="M 448,676 L 460,682 L 448,688 L 436,682 Z" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
      <text x="468" y="688" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.10em">DECISION</text>

      <rect x="580" y="676" width="20" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="608" y="688" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.10em">THE ONLY WRITE</text>
    </svg>
  </div>
</body>
</html>
